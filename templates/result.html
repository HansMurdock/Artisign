<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artisign - Hasil Verifikasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased flex items-center justify-center min-h-screen">
    
    <div class="bg-white p-10 rounded-2xl shadow-lg border border-slate-100 max-w-md w-full text-center">
        
        <!-- Logika Jinja untuk menampilkan icon Sukses (Hijau) atau Gagal (Merah) -->
        {% if type == 'success' %}
        <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
        </div>
        {% else %}
        <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
        </div>
        {% endif %}

        <h2 class="text-2xl font-bold mb-2">{{ title }}</h2>
        <p class="text-slate-500 mb-8">{{ message }}</p>

        <div class="flex flex-col gap-3">
            <!-- Jika sukses dan ada file yang bisa diunduh, tampilkan tombol download -->
            {% if file_url %}
            <a href="{{ file_url }}" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition shadow-md">
                Unduh Sertifikat & QR Code
            </a>
            {% endif %}
            
            <a href="/" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 rounded-lg transition">
                Kembali ke Beranda
            </a>
        </div>
    </div>

</body>
</html>
